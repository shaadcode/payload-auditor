name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build project
        run: bun build:safe

      - name: Job summary
        run: echo "✅ CI checks passed successfully!"
